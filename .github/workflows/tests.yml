name: Unlimotion Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  all-tests:
    name: Regression
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "true"

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json

    - name: Prepare isolated NuGet roots
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/nuget-local | Out-Null
        $packages = Join-Path $env:RUNNER_TEMP ('unlimotion-regression-nuget-' + [Guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Path $packages | Out-Null
        "NUGET_PACKAGES=$packages" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

    - name: Restore Test Projects
      shell: pwsh
      run: |
        $projects = @(
          "src/Unlimotion.Test/Unlimotion.Test.csproj",
          "tests/Unlimotion.UiTests.Headless/Unlimotion.UiTests.Headless.csproj"
        )

        foreach ($project in $projects) {
          dotnet restore $project --force --no-http-cache --configfile src/nuget.config `
            -p:DisableImplicitLibraryPacksFolder=true `
            -p:DisableImplicitNuGetFallbackFolder=true `
            -p:RestoreFallbackFolders=
        }

    - name: Run Unlimotion Tests
      shell: pwsh
      run: >
        dotnet test src/Unlimotion.Test/Unlimotion.Test.csproj
        -c Debug
        --no-restore
        -p:UseSharedCompilation=false
        --
        --maximum-parallel-tests 1
        --output Detailed

    - name: Run Headless UI Tests
      shell: pwsh
      run: >
        dotnet test tests/Unlimotion.UiTests.Headless/Unlimotion.UiTests.Headless.csproj
        -c Debug
        --no-restore
        -p:UseSharedCompilation=false
        --
        --maximum-parallel-tests 1
        --output Detailed

    - name: Run Headless UI Tests again
      shell: pwsh
      run: >
        dotnet test tests/Unlimotion.UiTests.Headless/Unlimotion.UiTests.Headless.csproj
        -c Debug
        --no-restore
        -p:UseSharedCompilation=false
        --
        --maximum-parallel-tests 1
        --output Detailed

  nuget-signature-chain:
    name: Signature
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "true"

    steps:
    - name: Checkout exact source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
        submodules: false

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json

    - name: Prepare isolated NuGet root
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/nuget-local | Out-Null
        $packages = Join-Path $env:RUNNER_TEMP ('unlimotion-signature-nuget-' + [Guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Path $packages | Out-Null
        "NUGET_PACKAGES=$packages" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

    - name: Verify ReactiveUI signature chain
      shell: pwsh
      run: ./scripts/Test-NuGetSignatureChain.ps1 -Mode RunAttempt -Lane Signature
