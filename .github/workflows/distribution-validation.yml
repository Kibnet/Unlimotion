name: Distribution validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      raw_tag:
        description: Synthetic stable tag used only for CI candidate naming
        required: true
        default: v1.28.0
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VPK_VERSION: 0.0.1298

jobs:
  changes:
    name: distribution-scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
      source_short: ${{ steps.scope.outputs.source_short }}
      raw_tag: ${{ steps.scope.outputs.raw_tag }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify distribution scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_RAW_TAG: ${{ inputs.raw_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          raw_tag="1.27.0"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_tag="$MANUAL_RAW_TAG"
          fi
          if [[ ! "$raw_tag" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "${raw_tag#v}" == "0.0.0" ]]; then
            echo "Invalid synthetic stable tag: $raw_tag" >&2
            exit 1
          fi

          relevant=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            relevant=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            if grep -Eq '^(distribution/|scripts/|src/|\.native/|\.gitmodules$|\.gitattributes$|\.github/workflows/(android-packaging|deb_packaging|distribution-validation|osx-packaging|windows-packaging)\.yml$|run\.(windows\.cmd|linux\.sh|macos\.sh)$|README(\.RU)?\.md$|global\.json$|Directory\.(Build|Packages)\.(props|targets)$|[Nn]u[Gg]et\.config$|specs/2026-07-1(7-readme-reliability-roadmap|8-distribution-support-contract)\.md$)' <<< "$changed_files"; then
              relevant=true
            fi
          fi

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "source_short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "raw_tag=$raw_tag" >> "$GITHUB_OUTPUT"

  contract:
    name: distribution-contract
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_name: distribution-contract-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_artifact_name: distribution-contract-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Assert immutable checkout
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne '${{ github.sha }}') { throw "HEAD $head does not match source SHA ${{ github.sha }}." }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'Contract checkout is not clean.' }

      - name: Resolve release identity
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/contract | Out-Null
          pwsh -NoProfile -File scripts/Resolve-ReleaseIdentity.ps1 `
            -RawTag $env:RAW_TAG `
            -SourceSha $env:SOURCE_SHA `
            -WorkflowSha $env:WORKFLOW_SHA `
            -TagBinding notApplicable `
            -AndroidVersionCode $env:ANDROID_VERSION_CODE `
            -AndroidVersionCodePolicy ci-test `
            -Manifest distribution/release-assets.json `
            -SupportMatrix distribution/support-matrix.json `
            -OutputPath artifacts/contract/identity.json

      - name: Validate schemas, inventory, identity, feeds and retry policy
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          pwsh -NoProfile -File scripts/test-distribution-contract.ps1 `
            -Area All `
            -SourceSha $env:SOURCE_SHA `
            -WorkflowSha $env:WORKFLOW_SHA `
            -BlobParityEvidencePath artifacts/contract/blob-parity.json `
            -EvidencePath artifacts/contract/contract-evidence.json

      - name: Validate root entry points
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-run-entrypoints.ps1

      - name: Validate paired README support snapshot
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-ReadmeDistributionContract.ps1 `
            -English README.md `
            -Russian README.RU.md `
            -SupportMatrix distribution/support-matrix.json `
            -RunNegativeFixtures

      - name: Validate Android scripts and publisher security
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-android-build-scripts.ps1

      - name: Validate script syntax and unchanged desktop publishers
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $scriptFiles = @(
            'scripts/Resolve-ReleaseIdentity.ps1',
            'scripts/test-distribution-contract.ps1',
            'scripts/Test-DistributionArtifact.ps1',
            'scripts/Build-WindowsDistribution.ps1',
            'scripts/Test-WindowsDistribution.ps1',
            'scripts/Test-ReadmeDistributionContract.ps1',
            'scripts/test-run-entrypoints.ps1',
            'scripts/test-android-build-scripts.ps1'
          )
          foreach ($file in $scriptFiles) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell parse failed for $file`: $($errors.Message -join '; ')" }
          }
          bash -n scripts/Build-LinuxDistribution.sh scripts/smoke-linux-artifacts.sh scripts/build-macos-distribution.sh scripts/test-macos-distribution.sh scripts/build-android-distribution.sh scripts/test-android-distribution.sh run.linux.sh run.macos.sh
          if ($LASTEXITCODE -ne 0) { throw 'Bash syntax validation failed.' }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --exit-code $env:BASE_SHA $env:GITHUB_SHA -- .github/workflows/windows-packaging.yml .github/workflows/deb_packaging.yml .github/workflows/osx-packaging.yml
            if ($LASTEXITCODE -ne 0) { throw 'Windows/Linux/macOS production publishers changed in Stage 3.' }
          }

      - name: Stage contract evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/upload/contract | Out-Null
          Copy-Item artifacts/contract/identity.json,artifacts/contract/contract-evidence.json,artifacts/contract/blob-parity.json -Destination artifacts/upload/contract

      - name: Upload contract evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-contract-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
          path: artifacts/upload/contract
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Record contract evidence transport receipt
        shell: pwsh
        run: |
          $identity = Get-Content -Raw artifacts/upload/contract/identity.json | ConvertFrom-Json
          $artifactId = '${{ steps.upload.outputs.artifact-id }}'
          $artifactDigest = '${{ steps.upload.outputs.artifact-digest }}'.ToLowerInvariant()
          if ($artifactId -cnotmatch '^[1-9][0-9]*$') { throw 'Contract artifact id is not a positive decimal value.' }
          if ($artifactDigest -cnotmatch '^[0-9a-f]{64}$') { throw 'Contract artifact digest is not a lowercase SHA-256 value.' }
          $payloadRoot = 'artifacts/upload/contract'
          $payloads = @('identity.json', 'contract-evidence.json', 'blob-parity.json') | ForEach-Object {
            $path = Join-Path $payloadRoot $_
            [ordered]@{
              fileName = $_
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $receipt = [ordered]@{
            schemaVersion = 1
            kind = 'distribution-evidence-transport-receipt'
            identity = [ordered]@{
              rawTag = [string]$identity.rawTag
              normalizedVersion = [string]$identity.normalizedVersion
              sourceSha = [string]$identity.sourceSha
              workflowSha = [string]$identity.workflowSha
              tagBinding = [string]$identity.tagBinding
              manifestSha256 = [string]$identity.manifestSha256
              supportMatrixSha256 = [string]$identity.supportMatrixSha256
              signatureProfile = [string]$identity.signatureProfile
            }
            artifact = [ordered]@{
              name = 'distribution-contract-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}'
              id = $artifactId
              digest = $artifactDigest
              retentionDays = 7
            }
            payloads = @($payloads)
            productionReady = $false
          }
          $receipt | ConvertTo-Json -Depth 8 -Compress | Set-Content -LiteralPath artifacts/contract/evidence-transport-receipt.json -Encoding utf8NoBOM

      - name: Upload contract evidence transport receipt
        id: upload_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-contract-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
          path: artifacts/contract/evidence-transport-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

  windows_x64:
    name: windows-x64-native
    needs: [changes, contract]
    if: needs.changes.outputs.relevant == 'true' && needs.contract.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_name: distribution-windows-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_artifact_name: distribution-windows-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install pinned Velopack CLI
        shell: pwsh
        run: dotnet tool install --tool-path "$env:RUNNER_TEMP/vpk" vpk --version "$env:VPK_VERSION" --ignore-failed-sources

      - name: Resolve release identity
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/distribution-validation | Out-Null
          pwsh -NoProfile -File scripts/Resolve-ReleaseIdentity.ps1 `
            -RawTag $env:RAW_TAG -SourceSha $env:SOURCE_SHA -WorkflowSha $env:WORKFLOW_SHA `
            -TagBinding notApplicable -AndroidVersionCode $env:ANDROID_VERSION_CODE -AndroidVersionCodePolicy ci-test `
            -Manifest distribution/release-assets.json -SupportMatrix distribution/support-matrix.json `
            -OutputPath artifacts/distribution-validation/identity.json

      - name: Build Windows candidate once
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Build-WindowsDistribution.ps1 `
            -Identity artifacts/distribution-validation/identity.json `
            -OutputDirectory artifacts/distribution-validation/windows-x64 `
            -VpkPath "$env:RUNNER_TEMP/vpk/vpk.exe"

      - name: Record exact Windows artifact envelope
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode Record -Identity artifacts/distribution-validation/identity.json `
            -ArtifactDirectory artifacts/distribution-validation/windows-x64/assets `
            -Evidence artifacts/distribution-validation/windows-x64/evidence/artifact-evidence.json `
            -Platform windows -Architecture x64 -SignatureProfile unsigned `
            -AssetId windows-feed-legacy,windows-feed-json,windows-updater-package-x64,windows-setup-x64,windows-portable-x64,windows-portable-x64-legacy

      - name: Validate installer and portable native launch
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-WindowsDistribution.ps1 `
            -Identity artifacts/distribution-validation/identity.json `
            -ArtifactDirectory artifacts/distribution-validation/windows-x64/assets `
            -ExpectedRunnerImage windows-2022 `
            -OutputEvidence artifacts/distribution-validation/windows-x64/evidence/windows-native.json

      - name: Stage Windows evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/upload/windows/assets,artifacts/upload/windows/evidence | Out-Null
          Copy-Item artifacts/distribution-validation/windows-x64/assets/* artifacts/upload/windows/assets
          Copy-Item artifacts/distribution-validation/windows-x64/evidence/* artifacts/upload/windows/evidence

      - name: Upload exact Windows candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-windows-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
          path: artifacts/upload/windows
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Record Windows transport receipt
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode TransportReceipt `
            -Identity artifacts/distribution-validation/identity.json `
            -EvidencePath artifacts/distribution-validation/windows-x64/evidence/artifact-evidence.json `
            -Evidence artifacts/distribution-validation/windows-x64/evidence/transport-receipt.json `
            -Platform windows -Architecture x64 `
            -ArtifactTransportName 'distribution-windows-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}' `
            -ArtifactTransportId '${{ steps.upload.outputs.artifact-id }}' `
            -ArtifactTransportDigest '${{ steps.upload.outputs.artifact-digest }}' `
            -ArtifactRetentionDays 7

      - name: Upload Windows transport receipt
        id: upload_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-windows-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
          path: artifacts/distribution-validation/windows-x64/evidence/transport-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Preserve Windows failure evidence without candidates
        if: ${{ always() && failure() }}
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $target = 'artifacts/failure/windows-x64'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $source = 'artifacts/distribution-validation/windows-x64/evidence'
          if (Test-Path -LiteralPath $source -PathType Container) {
            Get-ChildItem -LiteralPath $source -File | Copy-Item -Destination $target -Force
          }
          [ordered]@{
            schemaVersion = 1
            kind = 'distribution-producer-failure'
            status = 'fail'
            platform = 'windows'
            architecture = 'x64'
            rawTag = $env:RAW_TAG
            sourceSha = $env:GITHUB_SHA
            workflowSha = $env:WORKFLOW_SHA
            runId = [long]$env:GITHUB_RUN_ID
            runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            recordedAtUtc = [DateTime]::UtcNow.ToString('O')
            error = 'A prior Windows producer step failed; inspect the retained reports and job log.'
            productionReady = $false
          } | ConvertTo-Json -Depth 10 -Compress | Set-Content -LiteralPath "$target/failure.json" -Encoding utf8NoBOM

      - name: Upload Windows failure evidence
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-windows-x64-${{ needs.changes.outputs.source_short }}-failure-attempt-${{ github.run_attempt }}
          path: artifacts/failure/windows-x64
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

  linux_x64:
    name: linux-x64-native
    needs: [changes, contract]
    if: needs.changes.outputs.relevant == 'true' && needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_name: distribution-linux-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_artifact_name: distribution-linux-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate canonical JSON byte identity on Linux
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/distribution-validation | Out-Null
          pwsh -NoProfile -File scripts/test-distribution-contract.ps1 `
            -Area BlobParity `
            -SourceSha $env:SOURCE_SHA `
            -WorkflowSha $env:WORKFLOW_SHA `
            -BlobParityEvidencePath artifacts/distribution-validation/blob-parity-linux-x64.json

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install Linux validation tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y desktop-file-utils lintian file binutils; then
              exit 0
            fi
            sudo rm -rf /var/lib/apt/lists/*
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
          done

      - name: Install pinned Velopack CLI
        shell: bash
        run: dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION" --ignore-failed-sources

      - name: Resolve release identity
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/distribution-validation | Out-Null
          pwsh -NoProfile -File scripts/Resolve-ReleaseIdentity.ps1 `
            -RawTag $env:RAW_TAG -SourceSha $env:SOURCE_SHA -WorkflowSha $env:WORKFLOW_SHA `
            -TagBinding notApplicable -AndroidVersionCode $env:ANDROID_VERSION_CODE -AndroidVersionCodePolicy ci-test `
            -Manifest distribution/release-assets.json -SupportMatrix distribution/support-matrix.json `
            -OutputPath artifacts/distribution-validation/identity.json

      - name: Build Linux candidates from one publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.normalizedVersion' artifacts/distribution-validation/identity.json)"
          bash scripts/Build-LinuxDistribution.sh \
            --identity artifacts/distribution-validation/identity.json \
            --version "$version" \
            --source-sha "${{ github.sha }}" \
            --output-root artifacts/distribution-validation/linux-x64 \
            --vpk "$RUNNER_TEMP/vpk/vpk"

      - name: Retain Linux blob parity evidence
        shell: pwsh
        run: |
          Copy-Item -LiteralPath artifacts/distribution-validation/blob-parity-linux-x64.json `
            -Destination artifacts/distribution-validation/linux-x64/evidence/blob-parity.json

      - name: Record initial exact Linux artifact envelope
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode Record -Identity artifacts/distribution-validation/identity.json `
            -ArtifactDirectory artifacts/distribution-validation/linux-x64/candidates `
            -Evidence artifacts/distribution-validation/linux-x64/evidence/artifact-evidence.json `
            -Platform linux -Architecture x64 -SignatureProfile unsigned `
            -AssetId linux-feed-json,linux-updater-package-x64,linux-deb-x64,linux-appimage-x64

      - name: Resolve immutable Debian images
        id: images
        shell: bash
        run: |
          set -euo pipefail
          docker pull debian:12-slim
          docker pull debian:13-slim
          image12="$(docker inspect --format '{{index .RepoDigests 0}}' debian:12-slim)"
          image13="$(docker inspect --format '{{index .RepoDigests 0}}' debian:13-slim)"
          test -n "$image12" -a -n "$image13"
          echo "debian12=$image12" >> "$GITHUB_OUTPUT"
          echo "debian13=$image13" >> "$GITHUB_OUTPUT"

      - name: Validate Linux metadata and package policy
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/distribution-validation/linux-x64
          version="$(jq -er '.normalizedVersion' artifacts/distribution-validation/identity.json)"
          bash scripts/smoke-linux-artifacts.sh --mode metadata --version "$version" \
            --identity artifacts/distribution-validation/identity.json \
            --deb "$root/candidates/Unlimotion-$version.deb" --appimage "$root/candidates/Unlimotion.AppImage" \
            --report "$root/evidence/linux-metadata.json"

      - name: Validate Debian 12 and 13 clean install
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/distribution-validation/linux-x64
          version="$(jq -er '.normalizedVersion' artifacts/distribution-validation/identity.json)"
          for cell in "12|${{ steps.images.outputs.debian12 }}" "13|${{ steps.images.outputs.debian13 }}"; do
            release="${cell%%|*}"; image="${cell#*|}"
            bash scripts/smoke-linux-artifacts.sh --mode clean --version "$version" \
              --identity artifacts/distribution-validation/identity.json \
              --deb "$root/candidates/Unlimotion-$version.deb" --image "$image" \
              --harness-image '${{ steps.images.outputs.debian12 }}' --report "$root/evidence/debian-$release-clean.json"
          done

      - name: Validate Debian 12 and 13 upgrade continuity
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/distribution-validation/linux-x64
          version="$(jq -er '.normalizedVersion' artifacts/distribution-validation/identity.json)"
          for cell in "12|${{ steps.images.outputs.debian12 }}" "13|${{ steps.images.outputs.debian13 }}"; do
            release="${cell%%|*}"; image="${cell#*|}"
            bash scripts/smoke-linux-artifacts.sh --mode upgrade --version "$version" \
              --identity artifacts/distribution-validation/identity.json \
              --deb "$root/candidates/Unlimotion-$version.deb" --image "$image" \
              --harness-image '${{ steps.images.outputs.debian12 }}' --report "$root/evidence/debian-$release-upgrade.json"
          done

      - name: Validate AppImage on Debian 12 and 13
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/distribution-validation/linux-x64
          version="$(jq -er '.normalizedVersion' artifacts/distribution-validation/identity.json)"
          for cell in "12|${{ steps.images.outputs.debian12 }}" "13|${{ steps.images.outputs.debian13 }}"; do
            release="${cell%%|*}"; image="${cell#*|}"
            bash scripts/smoke-linux-artifacts.sh --mode appimage --version "$version" \
              --identity artifacts/distribution-validation/identity.json \
              --deb "$root/candidates/Unlimotion-$version.deb" --appimage "$root/candidates/Unlimotion.AppImage" \
              --image "$image" --harness-image '${{ steps.images.outputs.debian12 }}' \
              --report "$root/evidence/appimage-debian-$release.json"
          done

      - name: Prove missing runtime dependency remains a failure on Debian 12 and 13
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/distribution-validation/linux-x64
          version="$(jq -er '.normalizedVersion' artifacts/distribution-validation/identity.json)"
          for cell in "12|${{ steps.images.outputs.debian12 }}" "13|${{ steps.images.outputs.debian13 }}"; do
            release="${cell%%|*}"; image="${cell#*|}"
            bash scripts/smoke-linux-artifacts.sh --mode missing-runtime-negative --version "$version" \
              --identity artifacts/distribution-validation/identity.json \
              --deb "$root/candidates/Unlimotion-$version.deb" --image "$image" \
              --harness-image '${{ steps.images.outputs.debian12 }}' \
              --report "$root/evidence/missing-runtime-dependency-debian-$release.json"
          done

      - name: Revalidate unchanged Linux artifact envelope after native smoke
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode Validate -Identity artifacts/distribution-validation/identity.json `
            -ArtifactDirectory artifacts/distribution-validation/linux-x64/candidates `
            -Evidence artifacts/distribution-validation/linux-x64/evidence/artifact-evidence.json `
            -Platform linux -Architecture x64 `
            -AssetId linux-feed-json,linux-updater-package-x64,linux-deb-x64,linux-appimage-x64

      - name: Stage Linux tar transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/upload/linux/assets artifacts/upload/linux/evidence
          cp artifacts/distribution-validation/linux-x64/candidates/* artifacts/upload/linux/assets/
          cp artifacts/distribution-validation/linux-x64/evidence/* artifacts/upload/linux/evidence/
          test "$(stat -c '%a' artifacts/upload/linux/assets/Unlimotion.AppImage)" = 755
          tar --format=posix --numeric-owner --owner=0 --group=0 -cf artifacts/upload/linux-candidate.tar -C artifacts/upload/linux .
          tar -tvf artifacts/upload/linux-candidate.tar | grep -F -- '-rwxr-xr-x' | grep -F -- 'assets/Unlimotion.AppImage'

      - name: Upload exact Linux candidate as tar
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-linux-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
          path: artifacts/upload/linux-candidate.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Record Linux transport receipt and executable mode
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode TransportReceipt `
            -Identity artifacts/distribution-validation/identity.json `
            -EvidencePath artifacts/distribution-validation/linux-x64/evidence/artifact-evidence.json `
            -Evidence artifacts/distribution-validation/linux-x64/evidence/transport-receipt.json `
            -Platform linux -Architecture x64 `
            -ArtifactTransportName 'distribution-linux-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}' `
            -ArtifactTransportId '${{ steps.upload.outputs.artifact-id }}' `
            -ArtifactTransportDigest '${{ steps.upload.outputs.artifact-digest }}' `
            -ArtifactRetentionDays 7 `
            -TransportArchivePath artifacts/upload/linux-candidate.tar `
            -UnixExecutablePath artifacts/distribution-validation/linux-x64/candidates/Unlimotion.AppImage `
            -UnixAssetId linux-appimage-x64 `
            -ExpectedUnixMode 0755

      - name: Upload Linux transport receipt
        id: upload_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-linux-x64-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
          path: artifacts/distribution-validation/linux-x64/evidence/transport-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Preserve Linux failure evidence without candidates
        if: ${{ always() && failure() }}
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $target = 'artifacts/failure/linux-x64'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $source = 'artifacts/distribution-validation/linux-x64/evidence'
          if (Test-Path -LiteralPath $source -PathType Container) {
            Get-ChildItem -LiteralPath $source -File | Copy-Item -Destination $target -Force
          }
          [ordered]@{
            schemaVersion = 1
            kind = 'distribution-producer-failure'
            status = 'fail'
            platform = 'linux'
            architecture = 'x64'
            rawTag = $env:RAW_TAG
            sourceSha = $env:GITHUB_SHA
            workflowSha = $env:WORKFLOW_SHA
            runId = [long]$env:GITHUB_RUN_ID
            runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            recordedAtUtc = [DateTime]::UtcNow.ToString('O')
            error = 'A prior Linux producer step failed; inspect the retained reports and job log.'
            productionReady = $false
          } | ConvertTo-Json -Depth 10 -Compress | Set-Content -LiteralPath "$target/failure.json" -Encoding utf8NoBOM

      - name: Upload Linux failure evidence
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-linux-x64-${{ needs.changes.outputs.source_short }}-failure-attempt-${{ github.run_attempt }}
          path: artifacts/failure/linux-x64
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

