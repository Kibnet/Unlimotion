  android_build:
    name: android-api23-native-build
    needs: [changes, contract]
    if: needs.changes.outputs.relevant == 'true' && needs.contract.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "false"
      ANDROID_API_LEVEL: 23
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_NDK_VERSION: 27.2.12479018
    outputs:
      artifact_name: distribution-android-multi-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_artifact_name: distribution-android-multi-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source and native submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;${ANDROID_PLATFORM}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Android native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build perl zip unzip; then
              exit 0
            fi
            sudo rm -rf /var/lib/apt/lists/*
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
          done

      - name: Install .NET Android workload
        shell: bash
        run: dotnet workload install android --skip-manifest-update

      - name: Assert immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .native/libgit2-src rev-parse HEAD)" = "$(git ls-tree HEAD .native/libgit2-src | awk '{print $3}')"

      - name: Resolve release identity
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/distribution-validation/android-multi | Out-Null
          pwsh -NoProfile -File scripts/Resolve-ReleaseIdentity.ps1 `
            -RawTag $env:RAW_TAG -SourceSha $env:SOURCE_SHA -WorkflowSha $env:WORKFLOW_SHA `
            -TagBinding notApplicable -AndroidVersionCode $env:ANDROID_VERSION_CODE -AndroidVersionCodePolicy ci-test `
            -Manifest distribution/release-assets.json -SupportMatrix distribution/support-matrix.json `
            -OutputPath artifacts/distribution-validation/identity.json

      - name: Prepare exact Android native cache key
        id: prepare_cache
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-android-distribution.sh \
            --mode prepare-cache \
            --identity artifacts/distribution-validation/identity.json \
            --output-dir artifacts/distribution-validation/android-multi \
            --cache-dir artifacts/distribution-validation/android-native-cache \
            --runner-os '${{ runner.os }}' \
            --runner-arch '${{ runner.arch }}'

      - name: Restore exact Android native cache
        id: restore_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.prepare_cache.outputs.cache_path }}
          key: ${{ steps.prepare_cache.outputs.cache_key }}

      - name: Build and validate both Android candidates
        id: build_android
        shell: bash
        env:
          RESTORE_CACHE_HIT: ${{ steps.restore_cache.outputs.cache-hit }}
          RESTORE_MATCHED_KEY: ${{ steps.restore_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          cache_hit=false
          matched_key=""
          if [[ "$RESTORE_CACHE_HIT" == "true" ]]; then
            cache_hit=true
            matched_key="$RESTORE_MATCHED_KEY"
          fi
          bash scripts/build-android-distribution.sh \
            --mode build \
            --identity artifacts/distribution-validation/identity.json \
            --output-dir artifacts/distribution-validation/android-multi \
            --cache-dir artifacts/distribution-validation/android-native-cache \
            --requested-cache-key '${{ steps.prepare_cache.outputs.cache_key }}' \
            --matched-cache-key "$matched_key" \
            --cache-hit "$cache_hit" \
            --runner-os '${{ runner.os }}' \
            --runner-arch '${{ runner.arch }}' \
            --signature-profile test

      - name: Record exact Android arm64 artifact envelope
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode Record -Identity artifacts/distribution-validation/identity.json `
            -ArtifactDirectory artifacts/distribution-validation/android-multi/apks `
            -Evidence artifacts/distribution-validation/android-multi/artifact-evidence-arm64.json `
            -Platform android -Architecture arm64 -SignatureProfile test `
            -AssetId android-arm64-apk

      - name: Record exact Android x64 artifact envelope
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode Record -Identity artifacts/distribution-validation/identity.json `
            -ArtifactDirectory artifacts/distribution-validation/android-multi/apks `
            -Evidence artifacts/distribution-validation/android-multi/artifact-evidence-x64.json `
            -Platform android -Architecture x64 -SignatureProfile test `
            -AssetId android-x64-apk

      - name: Save validated Android native cache on exact miss
        if: steps.build_android.outputs.cache_save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build_android.outputs.cache_path }}
          key: ${{ steps.build_android.outputs.cache_key }}

      - name: Stage Android candidates and provenance
        shell: bash
        run: |
          set -euo pipefail
          source_root=artifacts/distribution-validation/android-multi
          mkdir -p artifacts/upload/android/assets artifacts/upload/android/evidence
          cp "$source_root"/apks/*.apk artifacts/upload/android/assets/
          cp "$source_root"/artifact-evidence-arm64.json artifacts/upload/android/evidence/
          cp "$source_root"/artifact-evidence-x64.json artifacts/upload/android/evidence/
          cp "$source_root"/evidence.json artifacts/upload/android/evidence/android-artifact.json
          cp "$source_root"/native-cache-evidence.json artifacts/upload/android/evidence/
          cp "$source_root"/native-inputs.json artifacts/upload/android/evidence/
          cp '${{ steps.build_android.outputs.cache_path }}/native-provenance.json' artifacts/upload/android/evidence/

      - name: Upload exact Android candidates
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android-multi-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
          path: artifacts/upload/android
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Record Android transport receipt
        shell: pwsh
        run: |
          $evidencePaths = @(
            'artifacts/distribution-validation/android-multi/artifact-evidence-arm64.json',
            'artifacts/distribution-validation/android-multi/artifact-evidence-x64.json'
          )
          & ./scripts/Test-DistributionArtifact.ps1 `
            -Mode TransportReceipt `
            -Identity artifacts/distribution-validation/identity.json `
            -EvidencePath $evidencePaths `
            -Evidence artifacts/distribution-validation/android-multi/transport-receipt.json `
            -Platform android -Architecture multi `
            -ArtifactTransportName 'distribution-android-multi-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}' `
            -ArtifactTransportId '${{ steps.upload.outputs.artifact-id }}' `
            -ArtifactTransportDigest '${{ steps.upload.outputs.artifact-digest }}' `
            -ArtifactRetentionDays 7

      - name: Upload Android transport receipt
        id: upload_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android-multi-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
          path: artifacts/distribution-validation/android-multi/transport-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Preserve Android build failure evidence without APKs
        if: ${{ always() && failure() }}
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $target = 'artifacts/failure/android-multi'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $source = 'artifacts/distribution-validation/android-multi'
          if (Test-Path -LiteralPath $source -PathType Container) {
            Get-ChildItem -LiteralPath $source -File -Filter '*.json' | Copy-Item -Destination $target -Force
          }
          [ordered]@{
            schemaVersion = 1
            kind = 'distribution-producer-failure'
            status = 'fail'
            platform = 'android'
            architecture = 'multi'
            rawTag = $env:RAW_TAG
            sourceSha = $env:GITHUB_SHA
            workflowSha = $env:WORKFLOW_SHA
            runId = [long]$env:GITHUB_RUN_ID
            runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            recordedAtUtc = [DateTime]::UtcNow.ToString('O')
            error = 'A prior Android build step failed; inspect the retained reports and job log.'
            productionReady = $false
          } | ConvertTo-Json -Depth 10 -Compress | Set-Content -LiteralPath "$target/failure.json" -Encoding utf8NoBOM

      - name: Upload Android build failure evidence
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android-multi-${{ needs.changes.outputs.source_short }}-failure-attempt-${{ github.run_attempt }}
          path: artifacts/failure/android-multi
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

  android_api23:
    name: android-api23-x64-native
    needs: [changes, contract, android_build]
    if: needs.changes.outputs.relevant == 'true' && needs.contract.result == 'success' && needs.android_build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_API_LEVEL: 23
    outputs:
      artifact_name: distribution-android-api23-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_artifact_name: distribution-android-api23-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install API 23 emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "emulator" \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"
          test -x "${ANDROID_SDK_ROOT}/emulator/emulator"
          echo "${ANDROID_SDK_ROOT}/emulator" >> "$GITHUB_PATH"

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Resolve release identity
        shell: pwsh
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/emulator/api23 | Out-Null
          pwsh -NoProfile -File scripts/Resolve-ReleaseIdentity.ps1 `
            -RawTag $env:RAW_TAG -SourceSha $env:SOURCE_SHA -WorkflowSha $env:WORKFLOW_SHA `
            -TagBinding notApplicable -AndroidVersionCode $env:ANDROID_VERSION_CODE -AndroidVersionCodePolicy ci-test `
            -Manifest distribution/release-assets.json -SupportMatrix distribution/support-matrix.json `
            -OutputPath artifacts/emulator/identity.json

      - name: Download exact Android candidate (attempt 1 of 2)
        id: download_android_1
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.android_build.outputs.artifact_id }}
          path: artifacts/download/android
          merge-multiple: true

      - name: Clean failed Android transport attempt
        if: steps.download_android_1.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- artifacts/download/android
          mkdir -p artifacts/download/android

      - name: Download exact Android candidate (attempt 2 of 2)
        id: download_android_2
        if: steps.download_android_1.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.android_build.outputs.artifact_id }}
          path: artifacts/download/android
          merge-multiple: true

      - name: Require successful bounded Android transport
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.download_android_1.outcome }}
          SECOND_OUTCOME: ${{ steps.download_android_2.outcome }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.android_build.outputs.artifact_name }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.android_build.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.android_build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 - \
            artifacts/emulator/identity.json \
            artifacts/emulator/api23/download-transport.json \
            "$FIRST_OUTCOME" "$SECOND_OUTCOME" android-api23 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          identity_path, output_path = map(pathlib.Path, sys.argv[1:3])
          first, second, scope = sys.argv[3:]
          passed = first == "success" or second == "success"
          selected = 1 if first == "success" else (2 if second == "success" else 0)
          source_artifact = {
              "name": os.environ["CANDIDATE_ARTIFACT_NAME"],
              "id": os.environ["CANDIDATE_ARTIFACT_ID"],
              "digest": os.environ["CANDIDATE_ARTIFACT_DIGEST"].lower(),
          }
          if not re.fullmatch(r"[1-9][0-9]*", source_artifact["id"]):
              raise SystemExit("Android source artifact id is invalid")
          if not re.fullmatch(r"[0-9a-f]{64}", source_artifact["digest"]):
              raise SystemExit("Android source artifact digest is invalid")
          identity = json.loads(identity_path.read_text(encoding="utf-8-sig"))
          payload = {
              "schemaVersion": 1,
              "kind": "distribution-download-transport",
              "status": "pass" if passed else "failure",
              "scope": scope,
              "identity": {
                  key: identity[key]
                  for key in (
                      "rawTag", "normalizedVersion", "sourceSha", "workflowSha", "tagBinding",
                      "manifestSha256", "supportMatrixSha256", "signatureProfile",
                  )
              },
              "sourceArtifact": source_artifact,
              "retry": {
                  "rule": "bounded-clean-retry",
                  "classification": "none" if first == "success" else "transient-transport",
                  "maxAttempts": 2,
                  "firstOutcome": first,
                  "secondOutcome": second or "skipped",
                  "selectedAttempt": selected,
                  "cleanupBeforeAttempt2": "completed" if first != "success" else "notRequired",
                  "exhausted": not passed,
              },
              "productionReady": False,
          }
          output_path.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          if not passed:
              raise SystemExit("Android candidate download failed after two clean attempts")
          PY

      - name: Revalidate downloaded Android x64 bytes
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-DistributionArtifact.ps1 `
            -Mode Validate `
            -Identity artifacts/emulator/identity.json `
            -ArtifactDirectory artifacts/download/android/assets `
            -Evidence artifacts/download/android/evidence/artifact-evidence-x64.json `
            -Platform android -Architecture x64 `
            -AssetId android-x64-apk

      - name: Install and launch exact x64 APK on API 23
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-android-distribution.sh \
            --mode emulator \
            --identity artifacts/emulator/identity.json \
            --input-dir artifacts/download/android/assets \
            --api-level 23 \
            --evidence artifacts/emulator/api23/evidence.json

      - name: Preserve API 23 failure evidence
        if: always()
        shell: bash
        env:
          RAW_TAG: ${{ needs.changes.outputs.raw_tag }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/emulator/api23
          if [[ ! -s artifacts/emulator/api23/evidence.json ]]; then
            python3 - artifacts/emulator/api23/evidence.json <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          payload = {
              "schemaVersion": 1,
              "outcome": "failed",
              "supportLevel": "notVerified",
              "mode": "emulator",
              "rawTag": os.environ["RAW_TAG"],
              "sourceSha": os.environ["GITHUB_SHA"],
              "workflowSha": os.environ["WORKFLOW_SHA"],
              "runtime": {"apiLevel": 23, "maxBootAttempts": 2},
              "error": "API 23 validation did not produce success evidence; inspect job logs.",
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Upload API 23 native evidence
        id: upload
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android-api23-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
          path: artifacts/emulator/api23
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Upload API 23 failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android-api23-${{ needs.changes.outputs.source_short }}-failure-attempt-${{ github.run_attempt }}
          path: artifacts/emulator/api23
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

      - name: Record API 23 evidence transport receipt
        if: success()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_NAME: distribution-android-api23-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - artifacts/emulator/identity.json artifacts/emulator/api23 artifacts/emulator/api23/evidence-transport-receipt.json <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys

          identity_path, payload_root, output_path = map(pathlib.Path, sys.argv[1:])
          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_digest = os.environ["ARTIFACT_DIGEST"].lower()
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              raise SystemExit("API 23 artifact id is not a positive decimal value")
          if not re.fullmatch(r"[0-9a-f]{64}", artifact_digest):
              raise SystemExit("API 23 artifact digest is not a lowercase SHA-256 value")
          identity = json.loads(identity_path.read_text(encoding="utf-8-sig"))
          payloads = []
          for name in (
              "evidence.json",
              "download-transport.json",
              "android-api23-emulator.log",
              "android-api23-logcat.txt",
          ):
              path = payload_root / name
              payloads.append({"fileName": name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          receipt = {
              "schemaVersion": 1,
              "kind": "distribution-evidence-transport-receipt",
              "identity": {
                  key: identity[key]
                  for key in (
                      "rawTag", "normalizedVersion", "sourceSha", "workflowSha", "tagBinding",
                      "manifestSha256", "supportMatrixSha256", "signatureProfile",
                  )
              },
              "artifact": {
                  "name": os.environ["ARTIFACT_NAME"],
                  "id": artifact_id,
                  "digest": artifact_digest,
                  "retentionDays": 7,
              },
              "payloads": payloads,
              "productionReady": False,
          }
          output_path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Upload API 23 evidence transport receipt
        if: success()
        id: upload_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android-api23-${{ needs.changes.outputs.source_short }}-attempt-${{ github.run_attempt }}-receipt
          path: artifacts/emulator/api23/evidence-transport-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0

